name: Sync Public Build Board

on:
  issues:
    types: [opened, reopened, closed, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: public-build-board-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: peaceful-world-org
  PROJECT_NUMBER: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - name: Check Projects token
        id: token
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PROJECTS_TOKEN is not configured yet; skipping board sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync changed issue
        if: steps.token.outputs.configured == 'true' && github.event_name == 'issues'
        shell: bash
        env:
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          project_id="$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json --jq '.id')"
          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          status_field_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .id')"
          backlog_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "Backlog") | .id')"
          todo_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "Todo") | .id')"
          in_progress_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "In Progress") | .id')"
          qa_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "QA") | .id')"
          done_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "Done") | .id')"

          for value in "$status_field_id" "$backlog_option_id" "$todo_option_id" "$in_progress_option_id" "$qa_option_id" "$done_option_id"; do
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "Could not resolve all required board Status options." >&2
              exit 1
            fi
          done

          item_id="$(gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 1000 --format json --jq ".items[] | select(.content.url == \"$ISSUE_URL\") | .id" | head -n 1 || true)"
          marker="$(printf '%s' "${ISSUE_BODY:-}" | grep -oE '<!--[[:space:]]*board-status:[[:space:]]*(backlog|todo|in-progress|qa)[[:space:]]*-->' | tail -n 1 || true)"
          marker_status="$(printf '%s' "$marker" | sed -E 's/.*board-status:[[:space:]]*([^[:space:]]+).*/\1/' || true)"

          # Public submissions are triage-only by default. An Issue becomes Board work only
          # after we add an explicit board-status marker, or if it is already on the Board.
          if [ -z "$marker_status" ] && [ -z "$item_id" ]; then
            echo "Skipped untriaged Issue $ISSUE_URL; it has no board-status marker and is not already on the Board." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Ordinary edits to an already tracked Issue must not reset its current Board status.
          if [ "$ISSUE_ACTION" != "closed" ] && [ "$ISSUE_ACTION" != "reopened" ] && [ -z "$marker_status" ]; then
            echo "Issue $ISSUE_URL is already tracked; no board-status marker was supplied, so its Board status was left unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$item_id" ]; then
            item_id="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" --format json --jq '.id')"
          fi

          if [ "$ISSUE_ACTION" = "closed" ]; then
            option_id="$done_option_id"
            status_name="Done"
          elif [ "$ISSUE_ACTION" = "reopened" ] && [ -z "$marker_status" ]; then
            option_id="$todo_option_id"
            status_name="Todo"
          else
            case "$marker_status" in
              backlog)
                option_id="$backlog_option_id"
                status_name="Backlog"
                ;;
              in-progress)
                option_id="$in_progress_option_id"
                status_name="In Progress"
                ;;
              qa)
                option_id="$qa_option_id"
                status_name="QA"
                ;;
              todo)
                option_id="$todo_option_id"
                status_name="Todo"
                ;;
              *)
                option_id="$todo_option_id"
                status_name="Todo"
                ;;
            esac
          fi

          gh project item-edit \
            --id "$item_id" \
            --project-id "$project_id" \
            --field-id "$status_field_id" \
            --single-select-option-id "$option_id"

          echo "Synced $ISSUE_URL to $status_name." >> "$GITHUB_STEP_SUMMARY"

      - name: Backfill approved open issues
        if: steps.token.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          project_id="$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json --jq '.id')"
          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          status_field_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .id')"
          backlog_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "Backlog") | .id')"
          todo_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "Todo") | .id')"
          in_progress_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "In Progress") | .id')"
          qa_option_id="$(printf '%s' "$fields_json" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "QA") | .id')"

          for value in "$status_field_id" "$backlog_option_id" "$todo_option_id" "$in_progress_option_id" "$qa_option_id"; do
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "Could not resolve all required Board Status options." >&2
              exit 1
            fi
          done

          added=0
          synced=0
          skipped=0

          while IFS= read -r issue_json; do
            [ -n "$issue_json" ] || continue
            issue_url="$(printf '%s' "$issue_json" | jq -r '.url')"
            issue_body="$(printf '%s' "$issue_json" | jq -r '.body // ""')"
            marker="$(printf '%s' "$issue_body" | grep -oE '<!--[[:space:]]*board-status:[[:space:]]*(backlog|todo|in-progress|qa)[[:space:]]*-->' | tail -n 1 || true)"
            marker_status="$(printf '%s' "$marker" | sed -E 's/.*board-status:[[:space:]]*([^[:space:]]+).*/\1/' || true)"
            item_id="$(gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 1000 --format json --jq ".items[] | select(.content.url == \"$issue_url\") | .id" | head -n 1 || true)"

            if [ -z "$marker_status" ]; then
              skipped=$((skipped + 1))
              continue
            fi

            if [ -z "$item_id" ]; then
              item_id="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$issue_url" --format json --jq '.id')"
              added=$((added + 1))
            fi

            case "$marker_status" in
              backlog) option_id="$backlog_option_id" ;;
              in-progress) option_id="$in_progress_option_id" ;;
              qa) option_id="$qa_option_id" ;;
              todo|*) option_id="$todo_option_id" ;;
            esac

            gh project item-edit \
              --id "$item_id" \
              --project-id "$project_id" \
              --field-id "$status_field_id" \
              --single-select-option-id "$option_id"
            synced=$((synced + 1))
          done < <(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json url,body --jq '.[] | @json')

          {
            echo "Approved-work backfill complete."
            echo "- Newly added to Board: $added"
            echo "- Approved Issues synced to their declared status: $synced"
            echo "- Untriaged Issues ignored: $skipped"
          } >> "$GITHUB_STEP_SUMMARY"
