schema_version: 1
last_updated: "2026-10-31"

principles:
  technical_source_of_truth: github
  institutional_memory: google_drive
  orchestration_layer: openai_chatgpt
  default_delivery_strategy: github_first
  rule: "Prefer one system of record per concern; add services only for a clear capability gap."

statuses:
  active: "In real use."
  available: "Benefit/account secured but not central to the workflow yet."
  planned: "Approved direction, not yet implemented."
  evaluate: "Worth testing before adoption."
  avoid: "Duplicates an existing system or does not fit current scale."
  legacy: "No longer in the production path; historical/rollback material only if accessible."

services:
  github:
    status: active
    category: development
    role:
      - code_and_version_history
      - product_source_of_truth
      - ci_cd
      - qa
      - pages_where_appropriate
    nonprofit_benefit: secured
    enterprise_cloud: active
    enterprise_discount: "Nonprofit discount recorded; verify actual billing application independently."
    criticality: critical

  google_workspace:
    status: active
    category: institutional_memory
    role:
      - drive_archive
      - docs
      - sheets
      - research
      - grants
      - operating_records
    criticality: critical

  openai_chatgpt:
    status: active
    category: ai_orchestration
    role:
      - research
      - drafting
      - analysis
      - connector_orchestration
      - cross_system_workflows
    nonprofit_benefit: secured
    criticality: high

  claude:
    status: active
    category: ai_research_and_funding
    role:
      - independent_read_only_code_review_on_demand
      - nonprofit_funder_and_grant_research
      - grant_application_drafts
      - long_context_critique
      - cross_model_validation
    nonprofit_benefit: "Claude Team for Nonprofits"
    funding_project: "Peaceful World - Funding & Partnerships (private; connected knowledge)"
    automation_policy: "Pilot first; do not duplicate ChatGPT funding monitoring or enable paid APIs without owner approval."
    criticality: high

  canva:
    status: active
    category: visual_production
    role:
      - social_assets
      - brand_templates
    nonprofit_benefit: secured
    criticality: low

  github_pages_website:
    status: active
    category: web_delivery
    source_repository: peaceful-world-org/website-lab
    generated_production_repository: peaceful-world-org/peaceful-world.org
    canonical_domain: peaceful-world.org
    cutover_date: "2026-10-05"
    role:
      - production_static_site
      - approved_release_gates
      - searchable_bilingual_pages
    rule: "Use website-lab AGENTS.md and Release Architecture v2 for current deployment authority."
    criticality: critical

  tilda:
    status: legacy
    category: historical_web_delivery
    lifecycle: retired_from_production
    role:
      - historical_site_reference
      - rollback_material_if_still_accessible
    direction: "Not production since 2026-10-05. Do not depend on Tilda, renew, restore, or retire its historical materials without a separate owner decision."
    criticality: low

  cloudflare:
    status: evaluate
    category: edge_delivery
    rule: "Not the current production host; do not modify live DNS or routing without explicit approval."
    role:
      - git_based_production_delivery
      - preview_deployments
      - cdn
      - dns_and_security
      - ai_crawler_visibility
    criticality: medium

  google_analytics_search_console:
    status: active
    category: analytics
    role:
      - audience_measurement
      - acquisition
      - search_indexing
      - search_performance
    criticality: medium

  new_relic:
    status: available
    category: observability
    activation_note: "Nonprofit program approved and order signed; actual active capabilities, location terms and charge safeguards still require confirmation."
    role:
      - uptime
      - frontend_errors
      - performance
      - synthetic_checks
      - post_deploy_health
    nonprofit_benefit: available_via_goodstack
    criticality: medium

  microsoft_365_business_premium:
    status: active
    category: security
    role:
      - defender_for_business
      - intune_available
      - entra_id_p1_available
      - conditional_access_available
    criticality: high

  azure:
    status: available
    category: backend_cloud
    role:
      - backend_functions_if_needed
      - databases_if_needed
      - storage_if_needed
      - scheduled_jobs_if_needed
      - api_or_ai_compute_if_needed
    nonprofit_benefit: "USD 2000 credits/year offer; activation and spend safeguards not verified."
    rule: "Do not migrate workloads merely to spend credits."
    criticality: low

  monday:
    status: active
    category: relationships_operations
    role:
      - crm_layer
      - partnerships
      - followups
      - operational_tracking
      - funding_opportunities_pipeline
    criticality: medium

  mailerlite:
    status: active
    category: owned_audience
    role:
      - newsletters
      - segmentation
      - supporter_communications
    criticality: medium

  donorbox:
    status: active
    category: fundraising
    role:
      - donations
    criticality: high

  goodstack:
    status: active
    category: nonprofit_infrastructure
    role:
      - nonprofit_verification
      - software_benefits
      - funding_discovery
    criticality: medium

  goodstack_grants_pro:
    status: evaluate
    category: funding_discovery
    role:
      - grant_matching
    evaluation_rule: "Keep only if it finds high-fit opportunities our existing search process misses."
    criticality: low

  buffer:
    status: evaluate
    category: social_distribution
    role:
      - multi_network_scheduling
      - distribution_automation
    criticality: low

  hootsuite:
    status: evaluate
    category: social_distribution
    role:
      - scheduling
      - inbox
      - monitoring
    nonprofit_benefit: "60% discount visible in Goodstack"
    criticality: low

  metricool:
    status: evaluate
    category: social_distribution
    role:
      - scheduling
      - analytics
      - ai_assisted_social_workflows
    criticality: low

  semrush:
    status: evaluate
    category: search_visibility
    timing: later
    role:
      - seo_research
      - technical_seo
      - ai_visibility_measurement
    rule: "Measurement tool, not a mechanism that causes AI citation."
    criticality: low

  ahrefs:
    status: evaluate
    category: search_visibility
    timing: later
    role:
      - backlinks
      - seo
      - ai_brand_visibility
    criticality: low

  similarweb:
    status: evaluate
    category: market_intelligence
    timing: later
    role:
      - external_traffic_intelligence
      - ai_referral_benchmarking
    criticality: low

avoid_or_not_needed_now:
  - gitlab
  - jira
  - confluence
  - asana
  - constant_contact
  - keela
  - power_apps
  - okta
  - splunk

future_on_trigger:
  auth0: "Add only if user accounts/authentication/cross-device profiles require it."
  twilio: "Add only for SMS, WhatsApp, OTP or transactional messaging."
  docusign: "Add when contract/signature volume justifies it."
  upwork_business_plus: "Use when funding exists for specialist contractors."

golden_path:
  version: 1
  flow:
    - idea
    - branch
    - pull_request
    - automated_quality_gate
    - preview
    - review
    - merge
    - production
    - live_monitoring
    - analytics_iteration
  pilot_repository: peaceful-world-org/website-lab
